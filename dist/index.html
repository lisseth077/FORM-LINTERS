<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles.css">
    <title>Formulario FINAL</title>
    <script defer="defer" src="runtime.bundle.js"></script>
    <script defer="defer" src="index.bundle.js"></script>
    <script defer="defer" src="style.bundle.js"></script>
</head>
<body>
    <h1 id="title">FORMULARIO SENA V1</h1>
    <p id="description">GRACIAS POR DEJAR SUS DATOS</p>
    <form id="survey-form">
        <fieldset>
            <label id="name-label">
                Name<input id="name" placeholder="Please enter your name" required />
            </label>
            <label id="email-label">
                Email<input id="email" type="email" placeholder="Please enter your email" required />
            </label>
            <label id="number-label">
                Age<input id="number" type="number" min="15" max="80" placeholder="Please enter your age" required />
            </label>
            <label for="dropdown">
                Choose an option
                <select id="dropdown">
                    <option value="">Select One Option</option>
                    <option value="option1">Option A</option>
                    <option value="option2">Option B</option>
                    <option value="option3">Option C</option>
                </select>
            </label>
            <label id="radio-buttons">
                Do you plan to buy a new car in the next 5 years?
                <label><input class="inline" name="account-type" type="radio" value="yes" />Yes</label>
                <label><input class="inline" name="account-type" type="radio" value="no" />No</label>
                <label><input class="inline" name="account-type" type="radio" value="maybe" />Maybe</label>
            </label>
        </fieldset>
        <fieldset>
            <label id="brands" for="dropdown">
                What is your favorite car brand?
                <select id="brands-dropdown">
                    <option value="">Select One Option</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Mazda">Mazda</option>
                    <option value="Renault">Renault</option>
                </select>
            </label>
            <label>
                What type of means of transportation do you own?
                <label><input class="inline" type="checkbox" name="transportation" value="car" />Car</label>
                <label><input class="inline" type="checkbox" name="transportation" value="boat" />Boat</label>
                <label><input class="inline" type="checkbox" name="transportation" value="bicycle" />Bicycle</label>
                <label><input class="inline" type="checkbox" name="transportation" value="motorcycle" />Motorcycle</label>
                <label><input class="inline" type="checkbox" name="transportation" value="plane" />Plane</label>
                <label><input class="inline" type="checkbox" name="transportation" value="bike" />Bike</label>
            </label>
        </fieldset>
        <fieldset>
            <label>
                Any comments or suggestions?
                <textarea id="comments" name="comments" placeholder="Please enter your comments"></textarea>
            </label>
        </fieldset>
        <input type="submit" id="submit" value="Submit" />
    </form>
</body>
</html>
